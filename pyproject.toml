[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scope"
version = "0.0.1"
description = "Trust-region latent planning with JEPA-style world models"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "hydra-core", "omegaconf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
